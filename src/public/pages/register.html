<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmarTask - Registro</title>
    <!-- CSS -->
    <link rel="stylesheet" href="./css/styles.css">
    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="form">
        <!-- FORMULARIO REGISTER -->
        <div class="form-log">
            <div class="form-cont">
                <h1>Te damos la bienvenida<br>a SmarTask</h1>
            
                <button class="btn btn-google">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="18px">
                    Continuar con Google
                </button>

                <div class="separator">
                    
                    o

                </div>

                <form>

                    <input type="email" placeholder="Correo electrónico" required/>
                    <button class="btn-sig">Continuar</button>

                </form>

                <p class="terminos">Al continuar, aceptas las <br><a href="#AñadirDirección">Condiciones del servicio</a> y la <a href="#AñadirDirección">Política de privacidad</a></p>

                <p class="load">¿Ya tienes una cuenta? <a href="/login">Iniciar sesión</a></p>

            </div>
        </div>
        <!-- IMAGEN MITAD -->
        <div class="img-log"></div>
    </div>
</body>
</html>
