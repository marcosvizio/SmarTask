<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmarTask - New Password</title>
    <!-- CSS -->
    <link rel="stylesheet" href="./css/login.css">
    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../img/logo_smartask_blanco.png">
</head>
<body>
    <div class="form">
        <!-- FORMULARIO LOGIN -->
        <div class="form-log">
            <div class="form-cont">
                <h1>No puedes ingresar?<br>Reinicia tu contraseña acá!</h1>
        
                <form>

                    <span id="msg"></span>
                    <input name="email" type="email" placeholder="Correo electrónico" required/>
                    <input name="password" type="password" placeholder="Ingresa tu nueva contraseña" required/>
                    <button class="btn-sig">Continuar</button>

                </form>

                <p class="terminos">Al continuar, aceptas las <br><a href="#AñadirDirección">Condiciones del servicio</a> y la <a href="#AñadirDirección">Política de privacidad</a></p>

                <p class="load">¿Nuevo en SmarTask? <a href="/register">Registrate</a></p>

            </div>
        </div>
        <!-- IMAGEN -->
        <div class="img-log"></div>
    </div>

     <div id="errorPopup" class="popup">
        <div class="popup-content">
            <p>No existe ninguna cuenta con ese correo electronico.</p>
            <button id="cerrarBtn" onclick="cerrarPopup()">Cerrar</button>
        </div>
    </div>
    <script type="module" src="../js/password.js"></script>
</body>
</html>
