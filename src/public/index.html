<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmarTask</title>
    <!-- CSS -->
    <link rel="stylesheet" href="./css/index.css">
    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="body-index">

    <!-- HEADER -->
    <header class="header">

        <div class="header-cont">
            <div class="logo">
                SmarTask
            </div>

            <nav class="nav">
                <ul>
                    <li><a href="#"><b>Funciones</b></a></li>
                    <li><a href="#"><b>Soluciones</b></a></li>
                    <li><a href="#"><b>Guía</b></a></li>
                </ul>
            </nav>

            <div>
                <a href="/login" class="btn btn-outline">Iniciar sesión</a>
                <a href="/register" class="btn btn-primary">Registrarse</a>
            </div>
        </div>
        
    </header>

    <!-- MAIN -->
    <main class="main">
        <section class="text">
            <h1>Convierte tus pendientes en logros<br>con SmarTask</h1>
            <p>La herramienta que organiza tus tareas,<br>mientras vos te enfocas en aprender.</p>
        </section>
        
        <section class="formulario">
            <h2>Inicia sesión</h2>
            <a href="/login">
                <button type="submit" class="btn btn-primary" >Ingresa</button>
            </a>
            <button class="btn btn-google">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="18px">
                Continuar con Google
            </button>
        </section>
    </main>

    <!-- FEATURES -->
    <article>
        <section class="features">
            <div class="features-grid">

                <div class="feature">
                    <h3>Administrá</h3>
                    <br>
                    <img src="./img/administra.jpeg" alt="Administra">
                </div>

                <div class="feature">
                    <h3>Organizá</h3>
                    <br>
                    <img src="./img/organiza.jpeg" alt="Organiza">
                </div>

                <div class="feature">
                    <h3>Planificá</h3>
                    <br>
                    <img src="./img/planifica.jpg" alt="Planifica">
                </div>

                <div class="feature">
                    <h3>Colaborá</h3>
                    <br>
                    <img src="./img/colabora.jpg" alt="Colabora">
                </div>
            </div>
        </section>
    </article>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-inner">
            <nav class="social">
                <a href="https://www.facebook.com/login/?locale=es_ES" aria-label="Facebook">
                    <img src="./img/facebook_logo.png" alt="Facebook">
                </a>
                <a href="https://x.com/?lang=es" aria-label="Twitter">
                    <img src="./img/x_logo.png" alt="Twitter">
                </a>
                <a href="https://www.instagram.com/" aria-label="Instagram">
                    <img src="./img/instagram_logo.png" alt="Instagram">
                </a>
                <a href="https://www.linkedin.com/feed/" aria-label="LinkedIn">
                    <img src="./img/linkedin_logo.png" alt="LinkedIn">
                </a>
            </nav>
        </div>
 </footer>
</body>
</html>
